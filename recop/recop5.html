<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recopilatori de Bloc - Test | OpoAMB</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Estils adaptats a la gamma Verda / Maragda per als Recopilatoris per Blocs */
    :root {
      --bg-body: #ffffff; 
      --bg-card: #f9fafb; 
      --accent: #059669; /* Canviat de vermell (#dc2626) a verd maragda (emerald-600) */
      --accent-hover: #047857; /* Verd més fosc per a botons */
      --dark: #000000;
      --gray-light: #f3f4f6; 
      --border-color: #e5e7eb; 
      --text-main: #1f2937; 
      --text-dim: #6b7280;
    }
    body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Outfit', sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 80px auto 40px; }
    #back-button, #reset-test-button { position: fixed; top: 15px; z-index: 2000; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; border: none; color: white; text-transform: uppercase; font-size: 0.75rem; transition: background 0.2s; }
    #back-button { left: 20px; background: var(--dark); }
    #back-button:hover { background: #374151; }
    #reset-test-button { left: 180px; background: var(--accent); }
    #reset-test-button:hover { background: var(--accent-hover); }
    
    /* Etiqueta superior opcional per destacar que és un examen de bloc */
    .badge-bloc { display: inline-block; background: #d1fae5; color: #065f46; font-size: 0.75rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 15px; border: 1px solid #a7f3d0; }

    h1 { text-align: center; font-weight: 800; font-size: 1.8rem; color: var(--dark); margin-bottom: 25px; line-height: 1.3; }
    h1 span { color: var(--accent); }
    .sticky-container { position: sticky; top: 0; background: var(--bg-body); z-index: 1000; padding: 15px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 25px; }
    .stats-container { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .left-group { display: flex; align-items: center; flex-grow: 1; gap: 20px; }
    #response-counter { white-space: nowrap; font-weight: 800; font-size: 0.9rem; background: var(--gray-light); padding: 6px 14px; border-radius: 20px; }
    #progress-bar { flex-grow: 1; height: 10px; background: var(--gray-light); border-radius: 10px; overflow: hidden; }
    #progress { height: 100%; width: 0%; background: var(--accent); transition: 0.4s; } /* Barra de progrés amb el color verd */
    .right-group { display: flex; gap: 8px; }
    .stat-box { font-weight: 800; font-size: 0.9rem; padding: 6px 14px; border-radius: 20px; white-space: nowrap; color: #fff; }
    .stat-correct { background: var(--dark); }
    .stat-incorrect { background: var(--accent); }
    
    .question { background: var(--bg-card); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; margin-bottom: 20px; transition: border-color 0.2s; }
    .question:hover { border-color: #a7f3d0; }
    .question h3 { font-size: 1.05rem; margin-bottom: 20px; color: var(--dark); }
    
    .answer { display: block; background: #ffffff; padding: 14px 18px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid var(--border-color); font-size: 0.95rem; transition: background-color 0.15s, border-color 0.15s; }
    .answer:hover { border-color: var(--accent); background: #f0fdf4; }
    
    .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; font-weight: 600; }
    .incorrect { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; font-weight: 600; }
    
    #submit { width: 100%; padding: 18px; border-radius: 12px; background: var(--accent); color: white; font-weight: 800; border: none; cursor: pointer; text-transform: uppercase; margin-top: 40px; transition: background 0.2s; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2); }
    #submit:hover { background: var(--accent-hover); }
    
    #score { padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 30px; font-weight: 800; font-size: 1.2rem; border: 2px solid var(--accent); background: #f0fdf4; color: #065f46; display: none; }
    
    footer { text-align: center; margin-top: 60px; padding: 20px; color: var(--text-dim); }
    .footer-jomp { font-weight: 800; color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <button id="back-button" onclick="window.location.href='../index.html'">⬅ Tornar</button>
    <button id="reset-test-button" onclick="reiniciarTest()">🔄 Reset</button>

    <div style="text-align: center;">
      <span class="badge-bloc">Examen Recopilatori</span>
    </div>
    <h1>BLOC 5 <br><span>Personal, Actes, Contractació i Serveis (Temes 27 al 31)</span></h1>
    
    <div class="sticky-container">
      <div class="stats-container">
        <div class="left-group">
          <div id="response-counter" class="stat-box" style="color:var(--dark);">📄 Respostes: 0/0</div>
          <div id="progress-bar"><div id="progress"></div></div>
        </div>
        <div class="right-group">
          <div id="correct-counter" class="stat-box stat-correct">✅ Encerts: 0</div>
          <div id="incorrect-counter" class="stat-box stat-incorrect">❌ Errors: 0</div>
        </div>
      </div>
    </div>

    <div id="score"></div>
    <form id="test-form"></form>
    <button id="submit" type="button">Finalitzar i Corregir</button>

    <footer>
      <span>© 2026 OpoAMB | Creat per</span> <span class="footer-jomp">JOMP</span>
    </footer>
  </div>

  <!-- Únic script necessari -->
  <script src="recop5test.js"></script>
</body>
</html>
